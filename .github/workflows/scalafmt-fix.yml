name: scalafmt-fix

on:
  workflow_dispatch:

jobs:
  scalafmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: sbt/setup-sbt@v1
      - name: Run scalafmt
        run: ./sbt "utilCache/scalafmt"
      - name: Show diff
        run: git status --porcelain && git diff --stat
      - name: Upload patch
        run: |
          git diff > scalafmt.patch
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: scalafmt-patch
          path: scalafmt.patch